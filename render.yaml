# The frontend deploys separately on Vercel (see frontend/vercel.json and DEPLOY.md) —
# only the backend API is a Render service.
services:
  - name: afaaq-backend
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /health
    envVars:
      # Neon connection string — paste from the Neon dashboard. SSL/pooling for it are
      # handled automatically in backend/src/prisma/prisma.service.ts.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LOG_LEVEL
        value: log
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_APPLICATION_FEE_CENTS
        value: "2000"
      # Comma-separated exact origins (any https://*.vercel.app preview URL is always
      # allowed automatically, see main.ts). Set to the real Vercel URL after the first
      # Vercel deploy, then add https://afaaq.de,https://www.afaaq.de once DNS is live.
      - key: FRONTEND_URL
        sync: false
      # Used to build the Stripe Checkout redirect — same value as FRONTEND_URL's
      # primary/production origin.
      - key: APP_URL
        sync: false
