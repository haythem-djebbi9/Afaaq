services:
  - name: afaaq-backend
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LOG_LEVEL
        value: log
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_APPLICATION_FEE_CENTS
        value: "2000"
      - key: CORS_ORIGIN
        value: https://afaaq-frontend.onrender.com
      - key: APP_URL
        value: https://afaaq-frontend.onrender.com

  - name: afaaq-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://afaaq-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
